<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CodeBridge · 验证码控制台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #6ea8ff;
  --bg: #0b1020;
  --card: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.09);
  --text: #e8eefc;
  --muted: #8fa3bf;
  --green: #3ddc84;
  --red: #ff6b6b;
}
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 24px clamp(14px, 4vw, 40px) 60px;
  position: relative;
  overflow-x: hidden;
}
body::before, body::after {
  content: "";
  position: fixed;
  width: 460px; height: 460px;
  border-radius: 50%;
  filter: blur(130px);
  opacity: .28;
  z-index: 0;
  pointer-events: none;
}
body::before { top: -140px; left: -120px; background: var(--accent); }
body::after { bottom: -180px; right: -140px; background: #9b6dff; }
.wrap { position: relative; z-index: 1; max-width: 940px; margin: 0 auto; animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo {
  width: 46px; height: 46px; border-radius: 15px;
  background: linear-gradient(135deg, #6ea8ff, #9b6dff);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; letter-spacing: .5px; color: #fff;
  box-shadow: 0 8px 26px rgba(110,168,255,.35);
}
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
.brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chips { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  padding: 6px 12px; border-radius: 999px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  font-size: 12px; color: #cfe0ff; white-space: nowrap;
}
.chip.ok { color: var(--green); border-color: rgba(61,220,132,.4); background: rgba(61,220,132,.1); }
.chip.warn { color: #ffb86b; border-color: rgba(255,184,107,.4); background: rgba(255,184,107,.1); }
.icon-btn {
  width: 34px; height: 34px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--border); background: rgba(255,255,255,.06); color: #cfe0ff;
  font-size: 16px; display: inline-flex; align-items: center; justify-content: center;
  transition: .2s;
}
.icon-btn:hover { background: rgba(110,168,255,.2); transform: rotate(20deg); }
.banner {
  display: none; margin-top: 18px; padding: 12px 16px; border-radius: 14px;
  background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.35);
  color: #ffb0b0; font-size: 13px; line-height: 1.6;
}
.banner.show { display: block; animation: rise .3s ease both; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  padding: 20px; margin-top: 18px;
  animation: rise .4s ease both;
}
.card h2 {
  font-size: 12px; font-weight: 700; color: #aebcd8; letter-spacing: 1.2px;
  text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.card h2 .tick { width: 8px; height: 8px; border-radius: 3px; background: linear-gradient(135deg, var(--accent), #9b6dff); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.stat { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 16px; padding: 14px 16px; }
.stat .k { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.stat .v { font-size: 15px; font-weight: 600; word-break: break-all; }
.ip-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.ip-row + .ip-row { margin-top: 8px; }
.ip { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 13px; color: #cfe0ff; }
.ip-copy { margin-left: auto; border: none; background: rgba(110,168,255,.14); color: #cfe0ff; padding: 4px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; }
.empty { color: #5f7290; font-size: 13px; padding: 16px 0; text-align: center; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.row:last-child { border-bottom: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #5a6b86; flex-shrink: 0; }
.dot.on { background: var(--green); box-shadow: 0 0 8px rgba(61,220,132,.8); }
.code-main { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 22px; font-weight: 700; letter-spacing: .06em; color: #fff; }
.meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.btn-copy {
  margin-left: auto; flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
  border: 1px solid rgba(110,168,255,.4); background: rgba(110,168,255,.14);
  color: #cfe0ff; font-size: 12px; cursor: pointer; transition: .2s;
}
.btn-copy:hover { background: rgba(110,168,255,.3); }
.btn-copy.copied { background: rgba(61,220,132,.2); border-color: rgba(61,220,132,.5); color: var(--green); }
.clip-text { font-size: 14px; color: #d7e2f7; word-break: break-all; max-height: 44px; overflow: hidden; }
.token-panel { display: none; margin-top: 18px; }
.token-panel.show { display: block; animation: rise .3s ease both; }
.token-line { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.token-input {
  flex: 1; min-width: 200px; padding: 11px 14px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
  color: #fff; font-size: 14px; outline: none;
}
.token-input:focus { border-color: var(--accent); }
.btn-primary {
  padding: 11px 20px; border-radius: 12px; border: none; cursor: pointer;
  background: linear-gradient(135deg, #6ea8ff, #9b6dff); color: #fff;
  font-size: 14px; font-weight: 600; transition: .2s;
}
.btn-primary:hover { filter: brightness(1.12); }
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 16px);
  background: rgba(20,30,55,.9); border: 1px solid rgba(110,168,255,.4);
  color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 9;
  backdrop-filter: blur(12px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
footer { margin-top: 22px; text-align: center; font-size: 11px; color: #46587a; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">CB</div>
    <div class="brand">
      <h1>CodeBridge</h1>
      <div class="sub" id="subTitle">验证码控制台</div>
    </div>
    <div class="chips">
      <span class="chip" id="chipSecure">--</span>
      <span class="chip" id="chipVersion">--</span>
      <button class="icon-btn" id="btnRefresh" title="刷新">&#8635;</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="card token-panel" id="tokenPanel">
    <h2><span class="tick"></span>需要访问令牌</h2>
    <div class="token-line">
      <input class="token-input" id="tokenInput" type="password" placeholder="请输入 PC 端设置的访问令牌" autocomplete="off" />
      <button class="btn-primary" id="btnTokenSave">保存</button>
    </div>
  </div>

  <section class="card">
    <h2><span class="tick"></span>状态</h2>
    <div class="grid" id="gridStatus"></div>
  </section>

  <section class="card">
    <h2><span class="tick"></span>局域网地址</h2>
    <div id="ipsBox"></div>
  </section>

  <section class="card">
    <h2><span class="tick"></span>在线设备</h2>
    <div id="devicesBox"></div>
  </section>

  <section class="card">
    <h2><span class="tick"></span>最近验证码</h2>
    <div id="codesBox"></div>
  </section>

  <section class="card">
    <h2><span class="tick"></span>剪贴板历史</h2>
    <div id="clipBox"></div>
  </section>

  <footer>CodeBridge Web Console · 数据每 4 秒自动刷新</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var SECURE = { 'true': '<b>HTTPS</b>', 'false': '<b>HTTP</b>' };
  var $ = function (id) { return document.getElementById(id); };
  var token = '';
  try { token = localStorage.getItem('cb_web_token') || ''; } catch (e) { token = ''; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtTime(iso) {
    if (!iso) return '--';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '--';
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function relTime(ts) {
    if (!ts) return '--';
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return '刚刚';
    var m = Math.floor(s / 60);
    if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }
  function copyText(text, btn) {
    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    var done = function () {
      if (btn) {
        btn.classList.add('copied');
        btn.textContent = '已复制 ✓';
        setTimeout(function () { btn.classList.remove('copied'); btn.textContent = '复制'; }, 1500);
      }
      toast('已复制到剪贴板');
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { if (legacy()) done(); else toast('复制失败'); });
    } else if (legacy()) {
      done();
    } else {
      toast('复制失败');
    }
  }

  function renderStatus(a) {
    var cards = [
      ['主机', esc(a.hostname)],
      ['端口', esc(a.port)],
      ['设备 ID', '<span style="font-family:ui-monospace,Consolas,monospace">' + esc(String(a.deviceId || '').slice(0, 8)) + '…</span>'],
      ['运行时间', esc(Math.floor((a.uptime || 0) / 60)) + ' 分钟'],
    ];
    $('gridStatus').innerHTML = cards.map(function (c) {
      return '<div class="stat"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
    }).join('');
    $('chipSecure').textContent = a.secure ? 'HTTPS' : 'HTTP';
    $('chipSecure').className = 'chip ' + (a.secure ? 'ok' : 'warn');
    $('chipVersion').textContent = 'v' + a.version;
  }

  function renderIps(ips) {
    var box = $('ipsBox');
    if (!ips || ips.length === 0) {
      box.innerHTML = '<div class="empty">未检测到局域网地址</div>';
      return;
    }
    box.innerHTML = ips.map(function (ip) {
      return '<div class="ip-row"><span class="ip">' + esc(ip.address) + '</span><span class="meta">' + esc(ip.name || '') + '</span>' +
        '<button class="ip-copy" data-ip="' + esc(ip.address) + '">复制</button></div>';
    }).join('');
  }

  function renderDevices(devices) {
    var box = $('devicesBox');
    if (!devices || devices.length === 0) {
      box.innerHTML = '<div class="empty">暂无在线设备</div>';
      return;
    }
    box.innerHTML = devices.map(function (d) {
      var name = d.name || d.hostname || d.id || '未知设备';
      var meta = [d.platform || 'android', d.hostname || '', d.from || ''].filter(Boolean).join(' · ');
      return '<div class="row"><span class="dot' + (d.online ? ' on' : '') + '"></span>' +
        '<div><div style="font-size:14px;font-weight:600">' + esc(name) + '</div>' +
        '<div class="meta">' + esc(meta) + ' · ' + (d.online ? '在线' : esc(relTime(d.lastSeen))) + '</div></div>' +
        '<span class="chip" style="margin-left:auto">' + (d.online ? '在线' : '离线') + '</span></div>';
    }).join('');
  }

  function renderCodes(history) {
    var box = $('codesBox');
    if (!history || history.length === 0) {
      box.innerHTML = '<div class="empty">暂无验证码记录</div>';
      return;
    }
    box.innerHTML = history.map(function (h) {
      var meta = [h.app, h.source, fmtTime(h.time)].filter(Boolean).join(' · ');
      return '<div class="row"><div><div class="code-main">' + esc(h.code) + '</div>' +
        '<div class="meta">' + esc(meta) + '</div></div>' +
        '<button class="btn-copy" data-copy="' + esc(h.code) + '">复制</button></div>';
    }).join('');
  }

  function renderClip(clip) {
    var box = $('clipBox');
    if (!clip || clip.length === 0) {
      box.innerHTML = '<div class="empty">暂无剪贴板历史</div>';
      return;
    }
    box.innerHTML = clip.map(function (c) {
      return '<div class="row"><div class="clip-text">' + esc(c.text) + '</div>' +
        '<div style="flex-shrink:0;text-align:right"><div class="meta">' + esc(fmtTime(c.time)) + '</div></div>' +
        '<button class="btn-copy" data-copy="' + esc(c.text) + '">复制</button></div>';
    }).join('');
  }

  function render(data) {
    renderStatus(data.app || {});
    renderIps((data.app && data.app.ips) || []);
    renderDevices(data.devices || []);
    renderCodes(data.history || []);
    renderClip(data.clipboardHistory || []);
    if (data.app && data.app.time) $('subTitle').textContent = '验证码控制台 · 更新于 ' + fmtTime(data.app.time);
  }

  function showError(msg) {
    var b = $('banner');
    b.textContent = msg;
    b.classList.add('show');
  }
  function hideError() {
    $('banner').classList.remove('show');
  }
  function showTokenPanel() {
    $('tokenPanel').classList.add('show');
    hideError();
  }
  function hideTokenPanel() {
    $('tokenPanel').classList.remove('show');
  }

  function refresh() {
    var headers = { 'Cache-Control': 'no-cache' };
    if (token) headers['X-P2P-Token'] = token;
    fetch('api/console', { headers: headers, cache: 'no-store' })
      .then(function (resp) {
        if (resp.status === 401 || resp.status === 403) { showTokenPanel(); throw null; }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      })
      .then(function (data) {
        if (!data || !data.ok) throw new Error('响应格式错误');
        hideTokenPanel();
        hideError();
        render(data);
      })
      .catch(function (err) {
        if (err === null) return;
        showError('无法连接到 CodeBridge 服务：' + (err && err.message ? err.message : err));
      });
  }

  $('btnRefresh').addEventListener('click', refresh);
  $('btnTokenSave').addEventListener('click', function () {
    token = $('tokenInput').value.trim();
    try { localStorage.setItem('cb_web_token', token); } catch (e) { /* ignore */ }
    toast(token ? '令牌已保存' : '已清除令牌（无令牌访问）');
    refresh();
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t && t.dataset && t.dataset.copy) { copyText(t.dataset.copy, t); return; }
    if (t && t.dataset && t.dataset.ip) { copyText(t.dataset.ip, t); toast('地址已复制'); }
  });

  refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
