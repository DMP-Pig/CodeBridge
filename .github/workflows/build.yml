name: Build CodeBridge (PC + Android)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc:
    name: PC Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    defaults:
      run:
        working-directory: pc-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.os }})
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.os }}
          path: |
            pc-client/dist/*.exe
            pc-client/dist/*.dmg
            pc-client/dist/*.AppImage
            pc-client/dist/*.deb
            pc-client/dist/*.zip
          if-no-files-found: warn

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (if keystore provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" --out CodeBridge-1.0.2beta1.apk app-release-aligned.apk
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android-app/CodeBridge-*.apk
            android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [ pc, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CodeBridge ${{ github.ref_name }}
          body: |
            ## CodeBridge ${{ github.ref_name }}

            - PC: Windows / macOS / Linux
            - Android APK
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.apk
          draft: false
          prerelease: true
